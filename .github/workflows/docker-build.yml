name: Build and Push Engine Image

# The engine image is the deploy artefact for the RunPod endpoint, so it is only
# pushed AFTER the engine's own test suite passes on the same commit. A green
# gateway suite does not imply a working engine: worker/test_engine.py had been
# failing silently since R53 for exactly that reason.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install engine deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pyarrow boto3 python-multipart pytest

      # R61: the image must ship s3_guard.py alongside main.py, because main.py
      # imports it inside make_client. test_image_contents.py asserts exactly
      # that, plus single-worker uvicorn on port 8000.
      - name: Run the engine test suite
        run: |
          cd worker
          pytest test_engine.py -q
          python test_engine_auth.py
          python test_image_contents.py
          python test_s3_guard.py
          python test_ssrf_guard.py
          python test_redaction.py
          python test_key_namespace.py
          python test_preflight_cleanup.py

      - name: Record the tested commit
        run: echo "TESTED_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Tag by commit SHA only, plus a moving convenience tag. DEPLOY from the
          # SHA tag or the digest -- never :latest, which can be repointed between
          # the digest check and the RunPod endpoint creation.
          tags: |
            hrm3478938/x402-parquet-engine:${{ github.sha }}
            hrm3478938/x402-parquet-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit the pinned digest
        run: |
          echo "### Engine image built and pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy tag: \`hrm3478938/x402-parquet-engine:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Create the RunPod endpoint from the SHA tag or the digest." >> "$GITHUB_STEP_SUMMARY"